# Builds the site and publishes it to GitHub Pages on every push to main (and the luajit-probe
# test version at /probe/).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The luajit-probe branch (a test version), built next to it at /probe/ while the branch exists.
      # Pushing to that branch does not deploy: run this workflow on main again (workflow_dispatch).
      - name: Build the luajit-probe branch into /probe/
        run: |
          if git ls-remote --exit-code --heads origin luajit-probe; then
            git fetch --depth=1 origin luajit-probe
            git worktree add ../probe FETCH_HEAD
            (cd ../probe && npm ci && npm test && npm run build)
            cp -r ../probe/dist dist/probe
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
