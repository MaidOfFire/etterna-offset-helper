# Builds the site and publishes it to GitHub Pages on every push to main, with the test version
# from the fallback-overlay branch (the in-game part installed for every theme) at /fallback/.
# This file is the same on both branches. Only main may publish (the github-pages environment's
# rule), so a push to fallback-overlay starts this workflow on main, which publishes both.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, fallback-overlay]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redeploy:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the fallback-overlay branch into /fallback/
        run: |
          if git ls-remote --exit-code --heads origin fallback-overlay; then
            git fetch --depth=1 origin fallback-overlay
            git worktree add ../fallback FETCH_HEAD
            (cd ../fallback && npm ci && npm test && npm run build)
            cp -r ../fallback/dist dist/fallback
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
